name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned, not -latest: a runner-image rollover is a change to the toolchain
    # under the test matrix, and it should be a commit here, not a surprise.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: PYTHON=python make install
      - name: Lint, typecheck, test
        run: make all
      # The Quickstart tells a stranger to `pip install .` — so build the
      # artifact and run it from OUTSIDE the tree, where a repo-relative path
      # would break. This is the check that the schema really is package data.
      - name: Build a wheel and run it from a clean venv
        run: |
          local.venv/bin/pip wheel . --no-deps -w dist/
          python -m venv /tmp/wv
          /tmp/wv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wv/bin/harness-validate --help
          /tmp/wv/bin/python -c "import json; from importlib.resources import files; \
            s = json.loads((files('harness_telemetry') / 'schema' / 'events.schema.json') \
            .read_text(encoding='utf-8')); print('packaged schema OK:', s['title'])"

  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.0
      - name: Install (needed for the table-length check, which shells out to Python)
        run: PYTHON=python make install
      - name: Lint markdown
        run: make lint-md
